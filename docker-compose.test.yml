services:
  # Local S3-compatible target for historical archive and observability E2E.
  # minio-init permits anonymous PUT only for .pb object keys.
  minio:
    image: dropcheck-minio:9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
    pull_policy: build
    build:
      context: ./docker/minio
      target: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a dedicated MinIO root user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a strong MinIO root password}
      MINIO_NOTIFY_WEBHOOK_ENABLE_INGESTER: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_INGESTER: http://ingester:8082/minio/events
      MINIO_NOTIFY_WEBHOOK_QUEUE_LIMIT_INGESTER: ${MINIO_NOTIFY_WEBHOOK_QUEUE_LIMIT_INGESTER:-10000}
    ports:
      - "${MINIO_API_BIND:-127.0.0.1}:${MINIO_API_PORT:-8080}:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1}:${MINIO_CONSOLE_PORT:-8081}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: dropcheck-mc:7394ce0dd2a80935aded936b09fa12cbb3cb8096
    pull_policy: build
    build:
      context: ./docker/minio
      target: mc
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set a dedicated MinIO root user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set a strong MinIO root password}
      MINIO_BUCKET: ${MINIO_BUCKET:-dropcheck}
    entrypoint: >
      /bin/sh -ec '
        attempts=0;
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          attempts=$$((attempts + 1));
          [ "$$attempts" -lt 60 ] || exit 1;
          sleep 1;
        done;
        mc mb --ignore-existing "local/$${MINIO_BUCKET}";
        printf "%s\n" "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:PutObject\"],\"Resource\":[\"arn:aws:s3:::$${MINIO_BUCKET}/*.pb\"]}]}" > /tmp/archive-upload.json;
        mc anonymous set-json /tmp/archive-upload.json "local/$${MINIO_BUCKET}";
        mc anonymous get-json "local/$${MINIO_BUCKET}";
        mc event add "local/$${MINIO_BUCKET}" arn:minio:sqs::INGESTER:webhook --event put --suffix .pb --ignore-existing;
      '
    restart: "no"

  ingester:
    build:
      context: ./controller
      dockerfile: ../docker/ingester/Dockerfile
    restart: unless-stopped
    environment:
      DROPCHECK_INGESTER_ADDR: ":8082"
      DROPCHECK_INGESTER_MINIO_ENDPOINT: minio:9000
      DROPCHECK_INGESTER_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set a dedicated MinIO root user}
      DROPCHECK_INGESTER_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set a strong MinIO root password}
      DROPCHECK_INGESTER_MINIO_BUCKET: ${MINIO_BUCKET:-dropcheck}
      DROPCHECK_INGESTER_MINIO_PREFIX: ${DROPCHECK_INGESTER_MINIO_PREFIX:-}
      DROPCHECK_INGESTER_PUSHGATEWAY_URL: http://pushgateway:9091
      DROPCHECK_INGESTER_POLL_INTERVAL: ${DROPCHECK_INGESTER_POLL_INTERVAL:-1m}
    depends_on:
      - minio
      - pushgateway

  pushgateway:
    image: prom/pushgateway:v1.11.3@sha256:74fa117cef2d7e383112d25139ff1c2d2e309c35389a9e0554a47136a1482e48
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-1d}"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_HTTP_BIND:-127.0.0.1}:${PROMETHEUS_HTTP_PORT:-9090}:9090"
    depends_on:
      - pushgateway

volumes:
  minio-data:
  prometheus-data:
