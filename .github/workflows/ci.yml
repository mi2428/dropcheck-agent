name: CI

'on':
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  controller:
    name: Controller (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest-self-hosted
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26.0', '1.26.8']
    env:
      GOFLAGS: -p=1
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: controller/go.sum
      - name: Provision pinned protobuf generators
        run: |
          archive="$RUNNER_TEMP/protoc-35.0-linux-x86_64.zip"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/protocolbuffers/protobuf/releases/download/v35.0/protoc-35.0-linux-x86_64.zip
          printf '%s  %s\n' 'a45cda0989c17dd950db55f6fbe1e5814c50fda08e87aa422980ac1f89dddbbc' "$archive" | sha256sum --check --strict
          unzip -q "$archive" -d "$RUNNER_TEMP/protoc-35.0"
          GOBIN="$RUNNER_TEMP/protoc-35.0/bin" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.1
          GOBIN="$RUNNER_TEMP/protoc-35.0/bin" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.3.0
      - name: Verify Go binding generation
        run: |
          make generate-go \
            PROTOC="$RUNNER_TEMP/protoc-35.0/bin/protoc" \
            PROTOC_GEN_GO="$RUNNER_TEMP/protoc-35.0/bin/protoc-gen-go" \
            PROTOC_GEN_GO_GRPC="$RUNNER_TEMP/protoc-35.0/bin/protoc-gen-go-grpc"
          git diff --exit-code -- controller/internal/controlpb
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Check formatting
        run: make fmt-check
      - name: Check Go modernizers
        run: make modernize-check
      - name: Build
        run: make build TARGET=controller
      - name: Test
        run: make test TARGET=controller
      - name: Vet and staticcheck
        run: make lint TARGET=controller
      - name: Race check
        working-directory: controller
        run: |
          GOFLAGS='-race -p=1' go test -count=1 ./...

  android:
    runs-on: ubuntu-latest-self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.2 build-tools;37.0.0'
      - name: Check shared contract and Android SDK
        run: |
          make check-shell
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.2/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/37.0.0/aapt2"
      - name: Unit test
        run: ./gradlew --no-daemon --max-workers=2 :agent:testDebugUnitTest --rerun-tasks --no-build-cache -PdropcheckVersion="$(make -s version)"
      - name: Verify unit-test completion
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path('agent/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          if not reports:
              raise SystemExit('No Android unit-test reports were produced')
          suites = [ET.parse(path).getroot() for path in reports]
          counts = {key: sum(int(suite.attrib[key]) for suite in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
          summary = 'Android unit tests: ' + ', '.join(f'{key}={value}' for key, value in counts.items())
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary + '\n')
          if counts['tests'] == 0 or any(counts[key] for key in ('failures', 'errors', 'skipped')):
              raise SystemExit('Android unit tests did not complete without failures, errors or skips')
          PY
      - name: Lint
        run: ./gradlew --no-daemon --max-workers=2 :agent:lintDebug -PdropcheckVersion="$(make -s version)"
      - name: Build app and instrumentation
        run: ./gradlew --no-daemon --max-workers=2 :agent:assembleDebug :agent:assembleDebugAndroidTest -PdropcheckVersion="$(make -s version)"
      - name: Upload Android test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-test-and-lint-reports
          retention-days: 7
          path: |
            agent/build/test-results/testDebugUnitTest/
            agent/build/reports/tests/testDebugUnitTest/
            agent/build/reports/lint-results-debug.*
