name: CI

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: controller/go.sum
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Check formatting
        run: make fmt-check
      - name: Build
        run: make build TARGET=controller
      - name: Test
        run: make test TARGET=controller
      - name: Vet and staticcheck
        run: make lint TARGET=controller
      - name: Race check
        working-directory: controller
        run: go test -race -count=1 ./...

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: '17.0.20.1+1'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407  # v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - name: Build
        run: make build TARGET=agent
      - name: Unit test
        run: make test TARGET=agent
      - name: Lint
        run: make lint TARGET=agent
