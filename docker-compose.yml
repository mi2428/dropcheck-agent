services:
  # Local S3-compatible target for standalone upload E2E.
  # Anonymous PUT is enabled on http://localhost:8080/dropcheck/... by minio-init.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dropcheck}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dropcheck-secret}
    ports:
      - "${MINIO_API_PORT:-8080}:9000"
      - "${MINIO_CONSOLE_PORT:-8081}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dropcheck}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dropcheck-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-dropcheck}
    entrypoint: >
      /bin/sh -c '
        until mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-dropcheck}" "${MINIO_ROOT_PASSWORD:-dropcheck-secret}"; do
          sleep 1;
        done;
        mc mb --ignore-existing "local/${MINIO_BUCKET:-dropcheck}";
        mc anonymous set upload "local/${MINIO_BUCKET:-dropcheck}";
        mc anonymous get "local/${MINIO_BUCKET:-dropcheck}";
      '
    restart: "no"

volumes:
  minio-data:
