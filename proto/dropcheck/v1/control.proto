}

message WifiInformationElement {
  int32 id = 1;
  int32 id_ext = 2;
  uint32 byte_count = 3;
  string bytes_hex = 4;
}

message WifiMcsNssSupport {
  string standard = 1;
  string bandwidth = 2;
  string direction = 3;
  string mcs_range = 4;
  uint32 nss = 5;
