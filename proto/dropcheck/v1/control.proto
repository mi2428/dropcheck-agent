syntax = "proto3";

package dropcheck.v1;

option go_package = "dropcheck/controller/internal/controlpb;controlpb";
option java_multiple_files = true;
option java_package = "io.dropcheck.agent.grpc";

service DropcheckControl {
  rpc Session(stream AgentFrame) returns (stream ControllerFrame);
}

message AgentFrame {
  uint64 seq = 1;
  string session_id = 2;
  string command_id = 3;

  oneof body {
    AgentHello hello = 10;
    CommandAccepted accepted = 11;
    CommandLog log = 12;
    CommandResult result = 13;
    CommandError error = 14;
    AgentHeartbeat heartbeat = 15;
  }
}

message ControllerFrame {
  uint64 seq = 1;
  string session_id = 2;
  string command_id = 3;

  oneof body {
    RunCommand run_command = 10;
    CancelCommand cancel_command = 11;
    ControllerHeartbeat heartbeat = 12;
  }
}

message AgentHello {
  string token = 1;
  string package_name = 2;
  string app_version = 3;
  DeviceInfo device = 4;
  repeated string capabilities = 5;
  string controller_agent_id = 6;
  string adb_serial = 7;
}

message DeviceInfo {
  string manufacturer = 1;
  string model = 2;
  string device = 3;
  int32 sdk = 4;
  string release = 5;
}

message AgentHeartbeat {
  int64 unix_time_ms = 1;
}

message ControllerHeartbeat {
  int64 unix_time_ms = 1;
}

message CommandAccepted {
  string command_name = 1;
}

message CommandLog {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_DEBUG = 1;
    LEVEL_INFO = 2;
    LEVEL_WARN = 3;
    LEVEL_ERROR = 4;
  }

  Level level = 1;
  string message = 2;
  int64 unix_time_ms = 3;
}

message CommandError {
  string message = 1;
  string detail = 2;
}

message CancelCommand {
  string reason = 1;
}

message RunCommand {
  reserved 24, 40, 41, 42, 43;
  reserved "watch_wifi", "set_controller_link_config", "get_controller_link_config", "get_controller_link_status", "reconnect_controller";

  string label = 1;

  oneof command {
    GetWifiStatus get_wifi_status = 10;
    ConnectWifi connect_wifi = 11;
    GetIpStatus get_ip_status = 12;
    Ping ping = 13;
    ResolveDns resolve_dns = 14;
    HttpCheck http_check = 15;
    GetWifiDiagnostics get_wifi_diagnostics = 16;
    GetWifiScan get_wifi_scan = 17;
    GetWifiCapabilities get_wifi_capabilities = 18;
    GetFreshWifiScan get_fresh_wifi_scan = 19;
    DisconnectWifi disconnect_wifi = 20;
    ForgetWifi forget_wifi = 21;
    WaitWifiConnected wait_wifi_connected = 22;
    AssertWifi assert_wifi = 23;
    MonitorWifi monitor_wifi = 25;
    GetWifiScanDetail get_wifi_scan_detail = 26;
    ReconnectWifi reconnect_wifi = 27;
    CycleWifi cycle_wifi = 28;
    Traceroute traceroute = 29;
    Wget wget = 30;
    PathMtu path_mtu = 31;
    GlobalIp global_ip = 32;
    EditStandaloneConfig edit_standalone_config = 33;
    GetStandaloneConfig get_standalone_config = 34;
    GetStandaloneStatus get_standalone_status = 35;
    ListStandaloneRuns list_standalone_runs = 36;
    GetStandaloneRun get_standalone_run = 37;
    ClearStandaloneRuns clear_standalone_runs = 38;
    RunStandaloneOnce run_standalone_once = 39;
  }
}

message GetWifiStatus {}

message GetWifiDiagnostics {}

message GetWifiScan {
  WifiBand band = 1;
}

message GetFreshWifiScan {
  WifiBand band = 1;
  uint32 timeout_ms = 2;
}

message GetWifiCapabilities {}

message ConnectWifi {
  enum Security {
    SECURITY_UNSPECIFIED = 0;
    SECURITY_WPA2_PSK = 1;
    SECURITY_WPA3_SAE = 2;
    SECURITY_WPA2_WPA3_TRANSITION = 3;
  }

  enum MacRandomization {
    MAC_RANDOMIZATION_UNSPECIFIED = 0;
    MAC_RANDOMIZATION_AUTO = 1;
    MAC_RANDOMIZATION_NONE = 2;
    MAC_RANDOMIZATION_PERSISTENT = 3;
    MAC_RANDOMIZATION_NON_PERSISTENT = 4;
  }

  string ssid = 1;
  string passphrase = 2;
  Security security = 3;
  uint32 timeout_ms = 4;
  string bssid = 5;
  WifiBand band = 6;
  MacRandomization mac_randomization = 7;
}

message DisconnectWifi {}

message ForgetWifi {
  string target = 1;
}

message WaitWifiConnected {
  string ssid = 1;
  string bssid = 2;
  ConnectWifi.Security security = 3;
  WifiBand band = 4;
  bool require_ip = 5;
  bool require_validated = 6;
  uint32 timeout_ms = 7;
}

message AssertWifi {
  string ssid = 1;
  string bssid = 2;
  ConnectWifi.Security security = 3;
  WifiBand band = 4;
  bool require_ip = 5;
  bool require_validated = 6;
  uint32 timeout_ms = 7;
}

message MonitorWifi {
  uint32 duration_ms = 1;
  uint32 interval_ms = 2;
}

message GetWifiScanDetail {
  string target = 1;
  WifiBand band = 2;
}

message ReconnectWifi {
  uint32 timeout_ms = 1;
}

message CycleWifi {
  ConnectWifi connect = 1;
  uint32 count = 2;
  bool forget_after_each = 3;
  uint32 pause_ms = 4;
  string ping_host = 5;
  string http_url = 6;
}

message GetIpStatus {
  NetworkSelector selector = 1;
}

message Ping {
  string host = 1;
  uint32 count = 2;
  uint32 timeout_ms = 3;
  NetworkSelector selector = 4;
  uint32 size_bytes = 5;
}

message Traceroute {
  string host = 1;
  uint32 max_hops = 2;
  uint32 timeout_ms = 3;
  NetworkSelector selector = 4;
  uint32 size_bytes = 5;
}

// PathMtu discovers the largest IP packet size that reaches host without
// fragmentation. min/max are MTU bytes, not ping payload bytes.
message PathMtu {
  string host = 1;
  uint32 timeout_ms = 2;
  NetworkSelector selector = 3;
  uint32 min_mtu_bytes = 4;
  uint32 max_mtu_bytes = 5;
}

message GlobalIp {
  IpFamily family = 1;
  uint32 timeout_ms = 2;
  NetworkSelector selector = 3;
}

message Wget {
  string url = 1;
  uint32 timeout_ms = 2;
  NetworkSelector selector = 3;
  reserved 4;
}

message ResolveDns {
  string name = 1;
  repeated DnsRecordType qtypes = 2;
  uint32 timeout_ms = 3;
  NetworkSelector selector = 4;
}

message HttpCheck {
  string url = 1;
  uint32 expected_status = 2;
  uint32 timeout_ms = 3;
  NetworkSelector selector = 4;
}

message EditStandaloneConfig {
  repeated StandaloneEdit edits = 1;
}

message StandaloneEdit {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_SET = 1;
    ACTION_DELETE = 2;
  }

  Action action = 1;
  repeated string path = 2;
  string value = 3;
}

message GetStandaloneConfig {}

message GetStandaloneStatus {}

message ListStandaloneRuns {
  uint32 limit = 1;
  bool include_synced = 2;
}

message GetStandaloneRun {
  string run_id = 1;
  bool mark_synced = 2;
}

message ClearStandaloneRuns {
  bool synced_only = 1;
  bool all = 2;
}

message RunStandaloneOnce {
  string festa = 1;
  bool save = 2;
}

message StandaloneConfig {
  bool enabled = 1;
  uint32 retention_ms = 2;
  uint64 max_bytes = 3;
  repeated StandaloneFesta festas = 4;
  StandaloneUploadConfig upload = 5;
}

message StandaloneUploadConfig {
  string url = 1;
  ConnectWifi wifi = 2;
}

message StandaloneFesta {
  reserved 5;

  string name = 1;
  bool enabled = 2;
  uint32 interval_ms = 3;
  repeated StandaloneWifiGroup wifi_groups = 4;
  repeated StandaloneCheck checks = 6;
}

message StandaloneWifiGroup {
  string name = 1;
  string essid = 2;
  string bssid = 3;
  string passphrase = 4;
  ConnectWifi.Security security = 5;
  WifiBand band = 6;
  bool require_ip = 7;
  bool require_validated = 8;
  uint32 timeout_ms = 9;
  ConnectWifi.MacRandomization mac_randomization = 10;
}

message StandaloneCheck {
  // User-visible check name. This is the stable key for update, delete, render,
  // and standalone measurement step naming.
  string name = 1;
  oneof test {
    StandaloneDnsCheck dns = 2;
    StandalonePingCheck ping = 3;
    StandaloneHttpCheck http = 4;
  }
}

message StandaloneDnsCheck {
  string name = 1;
  repeated DnsRecordType qtypes = 2;
  uint32 timeout_ms = 3;
}

message StandalonePingCheck {
  string host = 1;
  uint32 count = 2;
  uint32 timeout_ms = 3;
  uint32 size_bytes = 4;
}

message StandaloneHttpCheck {
  string url = 1;
  uint32 expected_status = 2;
  uint32 timeout_ms = 3;
}

message StandaloneStatus {
  bool enabled = 1;
  bool running = 2;
  string current_run_id = 3;
  string last_run_id = 4;
  int64 last_started_unix_ms = 5;
  int64 last_finished_unix_ms = 6;
  uint32 stored_runs = 7;
  uint32 unsynced_runs = 8;
  uint64 stored_bytes = 9;
  string message = 10;
}

message StandaloneRunSummary {
  string run_id = 1;
  string festa_name = 2;
  string config_hash = 3;
  int64 started_unix_ms = 4;
  int64 finished_unix_ms = 5;
  string status = 6;
  uint32 wifi_group_count = 7;
  uint32 step_count = 8;
  uint32 failed_step_count = 9;
  bool synced = 10;
  string message = 11;
}

message StandaloneRuns {
  repeated StandaloneRunSummary runs = 1;
  uint32 total_runs = 2;
  uint32 unsynced_runs = 3;
}

message StandaloneRunArchive {
  StandaloneRunSummary summary = 1;
  DeviceInfo device = 2;
  StandaloneFesta festa = 3;
  repeated StandaloneMeasurementStep steps = 4;
  repeated CommandLog logs = 5;
}

message StandaloneMeasurementStep {
  uint32 wifi_group_index = 1;
  string wifi_group_name = 2;
  uint32 step_index = 3;
  string step_name = 4;
  uint32 attempt = 5;
  int64 started_unix_ms = 6;
  int64 finished_unix_ms = 7;
  RunCommand command = 8;
  CommandResult result = 9;
  string error = 10;
}

message StandaloneClearResult {
  uint32 removed_runs = 1;
  uint64 removed_bytes = 2;
}

message NetworkSelector {
  reserved 1, 3;
  string ssid = 2;
}

enum WifiBand {
  WIFI_BAND_UNSPECIFIED = 0;
  WIFI_BAND_ALL = 1;
  WIFI_BAND_2_4_GHZ = 2;
  WIFI_BAND_5_GHZ = 3;
  WIFI_BAND_6_GHZ = 4;
  WIFI_BAND_60_GHZ = 5;
}

enum DnsRecordType {
  DNS_RECORD_TYPE_UNSPECIFIED = 0;
  DNS_RECORD_TYPE_A = 1;
  DNS_RECORD_TYPE_AAAA = 2;
}

enum IpFamily {
  IP_FAMILY_UNSPECIFIED = 0;
  IP_FAMILY_ALL = 1;
  IP_FAMILY_IPV4 = 2;
  IP_FAMILY_IPV6 = 3;
}

message CommandResult {
  reserved 21, 34, 35;
  reserved "wifi_watch", "controller_link_config", "controller_link_status";

  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_OK = 1;
    STATUS_FAILED = 2;
    STATUS_CANCELED = 3;
  }

  Status status = 1;
  string message = 2;
  int64 elapsed_ms = 3;

  oneof payload {
    WifiStatus wifi_status = 10;
    ConnectWifiResult connect_wifi = 11;
    IpStatus ip_status = 12;
    PingResult ping = 13;
    ResolveDnsResult resolve_dns = 14;
    HttpCheckResult http_check = 15;
    WifiDiagnostics wifi_diagnostics = 16;
    WifiScan wifi_scan = 17;
    WifiCapabilities wifi_capabilities = 18;
    WifiOperationResult wifi_operation = 19;
    WifiAssertResult wifi_assert = 20;
    WifiMonitorResult wifi_monitor = 22;
    WifiScanDetail wifi_scan_detail = 23;
    WifiCycleResult wifi_cycle = 24;
    TracerouteResult traceroute = 25;
    WgetResult wget = 26;
    PathMtuResult path_mtu = 27;
    GlobalIpResult global_ip = 28;
    StandaloneConfig standalone_config = 29;
    StandaloneStatus standalone_status = 30;
    StandaloneRuns standalone_runs = 31;
    StandaloneRunArchive standalone_run = 32;
    StandaloneClearResult standalone_clear = 33;
  }
}

message WifiStatus {
  bool enabled = 1;
  string state = 2;
  string active_network = 3;
  uint32 wifi_network_count = 4;
  WifiConnection connection = 5;
  IpStatus ip_status = 6;
  repeated string permissions = 7;
}

message WifiConnection {
  string ssid = 1;
  string bssid = 2;
  int32 rssi_dbm = 3;
  int32 network_id = 4;
  string supplicant_state = 5;
  int32 frequency_mhz = 6;
  int32 link_speed_mbps = 7;
  int32 tx_link_speed_mbps = 8;
  int32 rx_link_speed_mbps = 9;
  string wifi_standard = 10;
  string security_type = 11;
  string ipv4_address = 12;
  string mac_address = 13;
  bool hidden_ssid = 14;
  string detailed_state = 15;
  int32 signal_level = 16;
  int32 max_signal_level = 17;
  int32 max_supported_tx_link_speed_mbps = 18;
  int32 max_supported_rx_link_speed_mbps = 19;
  string passpoint_fqdn = 20;
  string passpoint_provider_friendly_name = 21;
  string passpoint_unique_id = 22;
  int32 subscription_id = 23;
  bool restricted = 24;
  string applicable_redactions = 25;
  string ap_mld_mac_address = 26;
  int32 ap_mlo_link_id = 27;
  repeated MloLinkInfo affiliated_mlo_links = 28;
  repeated MloLinkInfo associated_mlo_links = 29;
  repeated WifiInformationElement information_elements = 30;
  string raw = 31;
  string channel_width = 32;
  WifiHeCapabilities he_capabilities = 33;
  WifiHeOperation he_operation = 34;
  WifiEhtCapabilities eht_capabilities = 35;
  WifiEhtOperation eht_operation = 36;
  WifiHeUoraParameterSet he_uora_parameter_set = 37;
  WifiHeMuEdcaParameterSet he_mu_edca_parameter_set = 38;
  WifiHeSpatialReuseParameterSet he_spatial_reuse_parameter_set = 39;
  WifiHe6GhzCapabilities he_6ghz_capabilities = 40;
}

message IpStatus {
  string network_id = 1;
  repeated string transports = 2;
  bool validated = 3;
  bool internet = 4;
  string interface_name = 5;
  uint32 mtu = 6;
  repeated string addresses = 7;
  repeated string dns_servers = 8;
  string dhcp_server = 9;
  repeated string routes = 10;
  WifiConnection wifi = 11;
  repeated string capabilities = 12;
  int32 downstream_kbps = 13;
  int32 upstream_kbps = 14;
  int32 signal_strength = 15;
  string network_specifier = 16;
  int32 owner_uid = 17;
  repeated int32 subscription_ids = 18;
  repeated string enterprise_ids = 19;
  string raw_capabilities = 20;
  string domains = 21;
  string http_proxy = 22;
  string nat64_prefix = 23;
  bool private_dns_active = 24;
  string private_dns_server_name = 25;
  bool wake_on_lan_supported = 26;
  string raw_link_properties = 27;
}

message WifiDiagnostics {
  WifiStatus status = 1;
  WifiCapabilities capabilities = 2;
  repeated NetworkDiagnostics networks = 3;
  WifiScan scan = 4;
}

message WifiCapabilities {
  repeated DiagnosticField fields = 1;
  repeated string supported_bands = 2;
  repeated string unsupported_bands = 3;
  repeated string supported_standards = 4;
  repeated string unsupported_standards = 5;
  repeated string supported_security_modes = 6;
  repeated string unsupported_security_modes = 7;
  repeated string supported_features = 8;
  repeated string unsupported_features = 9;
  repeated string errors = 10;
}

message NetworkDiagnostics {
  string network_id = 1;
  bool active = 2;
  IpStatus ip_status = 3;
}

message WifiScan {
  repeated DiagnosticField fields = 1;
  repeated WifiScanResult results = 2;
  repeated string errors = 3;
}

message WifiScanResult {
  string ssid = 1;
  string bssid = 2;
  string capabilities = 3;
  int32 rssi_dbm = 4;
  int32 frequency_mhz = 5;
  string band = 6;
  string channel_width = 7;
  int32 center_freq0_mhz = 8;
  int32 center_freq1_mhz = 9;
  int64 timestamp_us = 10;
  string wifi_standard = 11;
  repeated string security_types = 12;
  string wifi_ssid = 13;
  string operator_friendly_name = 14;
  string venue_name = 15;
  bool passpoint = 16;
  bool responder_80211mc = 17;
  bool responder_80211az_ntb = 18;
  bool ranging_frame_protection_required = 19;
  bool secure_he_ltf_supported = 20;
  bool twt_responder = 21;
  string ap_mld_mac_address = 22;
  int32 ap_mlo_link_id = 23;
  repeated MloLinkInfo affiliated_mlo_links = 24;
  repeated WifiInformationElement information_elements = 25;
  string raw = 26;
  WifiHeCapabilities he_capabilities = 27;
  WifiHeOperation he_operation = 28;
  WifiEhtCapabilities eht_capabilities = 29;
  WifiEhtOperation eht_operation = 30;
  WifiHeUoraParameterSet he_uora_parameter_set = 31;
  WifiHeMuEdcaParameterSet he_mu_edca_parameter_set = 32;
  WifiHeSpatialReuseParameterSet he_spatial_reuse_parameter_set = 33;
  WifiHe6GhzCapabilities he_6ghz_capabilities = 34;
}

message MloLinkInfo {
  int32 link_id = 1;
  string state = 2;
  string band = 3;
  int32 channel = 4;
  int32 rssi_dbm = 5;
  int32 tx_link_speed_mbps = 6;
  int32 rx_link_speed_mbps = 7;
